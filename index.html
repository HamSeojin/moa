<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>모아</title>
<meta name="theme-color" content="#FBF6EE">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=1.4.2">
</head>
<body>
<header class="app-header">
  <h1 class="logo">모아</h1>
  <button class="icon-btn" data-tab="settings" aria-label="설정">⚙️</button>
</header>

<main id="views">
  <section id="view-today" class="view"></section>
  <section id="view-jot" class="view" hidden></section>
  <section id="view-habit" class="view" hidden></section>
  <section id="view-recap" class="view" hidden></section>
  <section id="view-explore" class="view" hidden></section>
  <section id="view-settings" class="view" hidden></section>
</main>

<nav class="tabbar">
  <button data-tab="today" class="tab active"><span class="tab-emoji">🌤️</span><span>오늘</span></button>
  <button data-tab="jot" class="tab"><span class="tab-emoji">✏️</span><span>끄적</span></button>
  <button data-tab="habit" class="tab"><span class="tab-emoji">🌱</span><span>해빗</span></button>
  <button data-tab="recap" class="tab"><span class="tab-emoji">🖼️</span><span>회고</span></button>
  <button data-tab="explore" class="tab"><span class="tab-emoji">🕸️</span><span>탐색</span></button>
</nav>

<script type="module" src="js/app.js?v=1.4.2"></script>
</body>
</html>
